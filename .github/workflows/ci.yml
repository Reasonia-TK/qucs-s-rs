name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux GUI build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Unit tests
        run: cargo test --locked
      - name: Release build
        run: cargo build --release --locked
      - name: CLI smoke test (netlist, render, check)
        shell: bash
        run: |
          B=target/release/qucs-s-rs
          $B --version
          $B netlist examples/inverting_amp.sch | grep -q "write spice4qucs.ac1.plot"
          $B render examples/inverting_amp.sch target/smoke.png > /dev/null
          $B check examples/inverting_amp.sch > /dev/null
      - name: Upload Windows binary
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: qucs-s-rs-windows
          path: target/release/qucs-s-rs.exe

  simulate:
    name: simulate with ngspice (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y ngspice libgtk-3-dev libxkbcommon-dev libwayland-dev
      - run: cargo build --release --locked
      - name: Simulate the examples with the built-in netlister (no Qucs-S needed)
        env:
          QUCS_RS_NETLISTER: builtin
        run: |
          B=target/release/qucs-s-rs
          $B simulate examples/inverting_amp.sch | tee sim.json
          grep -q '"ok": true' sim.json
          $B op examples/arxiv1902_02074_rf_plasma.sch
